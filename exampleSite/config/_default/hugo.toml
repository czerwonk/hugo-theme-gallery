copyright = "© Your Name"
defaultContentLanguage = "en"
disableKinds = ["taxonomy"]
enableRobotsTXT = true
locale = "en"
timeZone = "Europe/Berlin"
timeout = "120s"
title = "Gallery"

[params]
  defaultTheme = "dark"
  description = "Example site for hugo-theme-gallery"
  title = "My Gallery"
  [params.author]
    email = "user@example.com"
    name = "Your Name"
  [params.socialIcons]
    facebook = "https://www.facebook.com/"
    instagram = "https://www.instagram.com/"
    github = "https://github.com/nicokaiser/hugo-theme-gallery/"
    youtube = "https://www.youtube.com/"
    email = "mailto:user@example.com"
    #website = "https://example.com"
    #mastodon = "https://example.com"
    #pixelfed = "https://example.com"
    #mixcloud = "https://example.com"
    #flickr = "https://www.flickr.com"
    #500px = "https://500px"
    #whatsapp = "1234567890"
  [params.gallery]
    #fullSize = 2400
    #recentCount = 50
    #borderSize = 0
    #borderColor = "#ffffff"
    #boxSpacing = 10
    #targetRowHeight = 288
    #targetRowHeightTolerance = 0.25
    #sortBy = "Date"
    #sortOrder = "asc"

[outputs]
  home = ["HTML", "RSS"]
  page = ["HTML", "RSS"]
  section = ["HTML"]

[imaging]
  quality = 75
  resampleFilter = "CatmullRom"
  [imaging.exif]
    disableDate = false
    disableLatLong = true
    includeFields = "ImageDescription|Orientation"

[module]
  [module.hugoVersion]
    min = "0.121.2"
  [[module.imports]]
    path = "github.com/czerwonk/danalog-hugo-theme/v4"

[menu]
  [[menu.main]]
    name = "Galleries"
    identifier = "galleries"
    weight = 1
  [[menu.main]]
    name = "Equipment"
    identifier = "equipment"
    weight = 2
  [[menu.footer]]
    name = "GitHub"
    url = "https://github.com/nicokaiser/hugo-theme-gallery/"
    weight = 3

[services]
  [services.rss]
    limit = 100
