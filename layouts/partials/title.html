  <hgroup>
    {{ with site.Params.banner }}
      {{ $width := site.Params.bannerWidth }}
      {{ $height := site.Params.bannerHeight }}
      <a href="{{ "/" | relURL }}"><img class="banner" src="{{ . | relURL }}" alt="{{ $.Site.Title }}"{{ with $width }} width="{{ . }}"{{ end }}{{ with $height }} height="{{ . }}"{{ end }}></a>
    {{ end }}
{{ if .Title }}
    <h1>{{ .Title }}</h1>
{{ end }}
    {{ with .Params.Description }}
      <p>{{ . | markdownify }}</p>
    {{ end }}
  </hgroup>
