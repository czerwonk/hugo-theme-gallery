  <hgroup>
    {{ with site.Params.banner }}
      <a href="{{ "/" | relURL }}"><img class="banner" src="{{ . | relURL }}" alt="{{ $.Site.Title }}"></a>
    {{ end }}
{{ if .Title }}
    <h1>{{ .Title }}</h1>
{{ end }}
    {{ with .Params.Description }}
      <p>{{ . | markdownify }}</p>
    {{ end }}
  </hgroup>
